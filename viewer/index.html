<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Tropical Agriculturist — articles</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root { --ink:#222; --muted:#6b6b6b; --line:#ddd; --bg:#fafaf7; --accent:#7a2e1d; --chip:#eee; --warn:#b00020; }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.45 Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); }
  header { display:flex; gap:1.5rem; align-items:baseline; padding:.6rem 1rem; border-bottom:1px solid var(--line); background:#fff; position:sticky; top:0; z-index:5; }
  header h1 { font-size:1.1rem; margin:0; font-weight:normal; }
  header a, header button { font: inherit; font-size:.9rem; color:var(--accent); background:none; border:1px solid var(--line); border-radius:4px; padding:.15rem .5rem; cursor:pointer; text-decoration:none; }
  header .status { margin-left:auto; color:var(--muted); font-size:.85rem; }
  main { display:grid; grid-template-columns: 150px 1fr; min-height: calc(100vh - 3rem); }
  nav { border-right:1px solid var(--line); padding:.5rem 0; background:#fff; overflow-y:auto; max-height: calc(100vh - 3rem); position:sticky; top:3rem; }
  nav a { display:flex; justify-content:space-between; padding:.12rem .8rem; color:var(--ink); text-decoration:none; font-size:.9rem; }
  nav a small { color:var(--muted); }
  nav a.on { background:var(--accent); color:#fff; } nav a.on small { color:#f3dcd6; }
  section#content { padding:1rem 1.5rem 4rem; max-width: 1100px; }
  h2 { font-weight:normal; font-size:1.3rem; margin:.2rem 0 .8rem; }
  .issues { display:grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap:.6rem; }
  .issue { border:1px solid var(--line); background:#fff; padding:.5rem .7rem; border-radius:4px; cursor:pointer; }
  .issue:hover { border-color:var(--accent); }
  .issue b { font-weight:normal; color:var(--accent); }
  .issue.vol { background:#f6f4ee; }
  .issue small a { color:var(--accent); }
  article.contents .title { color:var(--muted); font-style:italic; }
  .issue small { color:var(--muted); display:block; }
  .toolbar { display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; margin:.4rem 0 1rem; font-size:.9rem; color:var(--muted); }
  .toolbar button, .toolbar label { font: inherit; font-size:.85rem; border:1px solid var(--line); background:#fff; border-radius:4px; padding:.15rem .5rem; cursor:pointer; }
  article { background:#fff; border:1px solid var(--line); border-radius:4px; margin:0 0 .7rem; }
  article > .head { display:grid; grid-template-columns: 2.2rem 1fr auto; gap:.4rem .6rem; padding:.5rem .8rem; cursor:pointer; align-items:start; }
  article > .head .n { color:var(--muted); font-size:.85rem; padding-top:.15rem; }
  article > .head .title { font-size:1.02rem; }
  article > .head .meta { color:var(--muted); font-size:.82rem; margin-top:.15rem; }
  article > .head .pages { text-align:right; font-size:.82rem; white-space:nowrap; }
  article > .head .pages a { color:var(--accent); text-decoration:none; margin-left:.3rem; }
  .chip { display:inline-block; font-size:.72rem; background:var(--chip); border-radius:3px; padding:0 .35rem; margin-right:.3rem; color:#444; vertical-align:middle; }
  .chip.sec { background:#e8eef7; } .chip.warn { background:#fde8ea; color:var(--warn); } .chip.dup { background:#f0e6d2; }
  .body { display:none; border-top:1px solid var(--line); padding:.6rem 1rem 1rem 3.4rem; }
  article.open .body { display:grid; grid-template-columns: 1fr 230px; gap:1rem; }
  .text { max-width: 70ch; overflow-wrap:anywhere; }
  .text h1,.text h2,.text h3,.text h4,.text h5,.text h6 { font-size:1.05rem; font-weight:bold; margin:.9rem 0 .3rem; }
  .text table { border-collapse:collapse; font-size:.85rem; margin:.5rem 0; max-width:100%; display:block; overflow-x:auto; }
  .text td,.text th { border:1px solid var(--line); padding:.1rem .35rem; vertical-align:top; }
  .text img { max-width:100%; }
  .pagebreak { border:0; border-top:1px dashed #bbb; margin:1rem 0 .6rem; text-align:right; color:var(--muted); font-size:.75rem; height:0; overflow:visible; }
  .pagebreak::after { content: attr(data-label); position:relative; top:-.7rem; background:#fff; padding:0 .3rem; }
  .thumbs { position:sticky; top:3.5rem; align-self:start; font-size:.78rem; color:var(--muted); }
  .thumbs a { display:block; margin-bottom:.5rem; color:inherit; text-decoration:none; }
  .thumbs img { width:100%; border:1px solid var(--line); background:#eee; display:block; }
  .prov { font-size:.75rem; color:var(--muted); margin-top:.6rem; }
  article.dup { opacity:.55; }
  .dim { color:var(--muted); }
  .empty { color:var(--muted); font-style:italic; padding:2rem 0; }
  .sample article .where { font-size:.82rem; color:var(--muted); padding:.3rem .8rem 0; }
</style>
</head>
<body>
<header>
  <h1>The Tropical Agriculturist (Colombo, 1881–1945) — articles</h1>
  <button id="btn-random" title="Load random canonical articles from across the corpus">Random sample</button>
  <a href="../articles/README.md" target="_blank">About the data</a>
  <span class="status" id="status"></span>
</header>
<main>
  <nav id="years"></nav>
  <section id="content"><div class="empty">Loading index…</div></section>
</main>
<script>
(async function () {
  const DATA = "../articles/by_year/";
  const $ = (s, el = document) => el.querySelector(s);
  const status = (t) => { $("#status").textContent = t || ""; };
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const yearCache = new Map();
  let index = {};

  async function fetchGz(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`${url}: ${r.status}`);
    const buf = new Uint8Array(await r.arrayBuffer());
    try { return pako.ungzip(buf, { to: "string" }); }
    catch (e) { return new TextDecoder().decode(buf); }   // server already decompressed it
  }
  async function loadYear(y) {
    if (yearCache.has(y)) return yearCache.get(y);
    status(`loading ${y}…`);
    const txt = await fetchGz(`${DATA}articles_${y}.jsonl.gz`);
    const recs = txt.split("\n").filter(Boolean).map(l => JSON.parse(l));
    recs.sort((a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
    yearCache.set(y, recs); status("");
    return recs;
  }

  // --- rendering -------------------------------------------------------------------------
  marked.setOptions({ gfm: true, breaks: false, mangle: false, headerIds: false });
  function renderText(t) {
    // page markers "123------" (the start of scan page 123) -> a labelled rule
    t = t.replace(/^(\d+)-{20,}\s*$/gm, (_, p) => `\n<hr class="pagebreak" data-label="scan page ${p}">\n`);
    return marked.parse(t);
  }
  const inline = (t) => marked.parseInline(esc(t));          // *italics* in titles and bylines
  function thumbs(r) {
    return r.pages.map(p => {
      const src = p.image_url.replace(/\.jpg$/, "_w300.jpg");
      const label = `scan ${p.page}${p.folio ? " · p. " + esc(p.folio) : ""}`;
      return `<a href="${esc(p.viewer_url)}" target="_blank" title="open on archive.org">
        <img loading="lazy" src="${esc(src)}" alt="${label}" onerror="this.src='${esc(p.image_url)}';this.onerror=null">${label}</a>`;
    }).join("");
  }
  function articleEl(r, n, extra = "") {
    const chips = [];
    if (r.section) chips.push(`<span class="chip sec">${esc(r.section)}</span>`);
    if (r.part === "supplement") chips.push(`<span class="chip">supplement</span>`);
    if (!r.canonical) chips.push(`<span class="chip dup">duplicate copy</span>`);
    if (r.words < 20) chips.push(`<span class="chip warn">${r.words} words</span>`);
    if (r.title === "(untitled)") chips.push(`<span class="chip warn">untitled</span>`);
    if (r.kind === "contents") chips.push(`<span class="chip sec">contents table</span>`);
    if (r.split_from) chips.push(`<span class="chip">split from ${esc(r.split_from.split("#").pop())}</span>`);
    const pages = r.pages.map(p => `<a href="${esc(p.viewer_url)}" target="_blank">${p.folio ? "p." + esc(p.folio) : "n" + p.page}</a>`).join("");
    const el = document.createElement("article");
    el.className = r.canonical ? "" : "dup"; if (r.kind === "contents") el.classList.add("contents"); el.id = "a-" + r.id.replace(/[^\w-]/g, "_");
    el.innerHTML = `${extra}
      <div class="head">
        <div class="n">${n}</div>
        <div><div class="title">${inline(r.title)}</div>
          <div class="meta">${chips.join("")}${r.byline ? inline(r.byline) + " · " : ""}${r.words.toLocaleString()} words · ${r.pages.length} page${r.pages.length === 1 ? "" : "s"}</div></div>
        <div class="pages">${pages}</div>
      </div>
      <div class="body"></div>`;
    $(".head", el).addEventListener("click", (e) => { if (e.target.tagName !== "A") toggle(el, r); });
    return el;
  }
  function toggle(el, r, force) {
    const open = force ?? !el.classList.contains("open");
    el.classList.toggle("open", open);
    const body = $(".body", el);
    if (open && !body.dataset.done) {
      body.dataset.done = 1;
      body.innerHTML = `<div class="text">${renderText(r.text)}
          <div class="prov">id ${esc(r.id)} · ${esc(r.doc)} · segments ${esc(JSON.stringify(r.segments))}</div></div>
        <div class="thumbs">${thumbs(r)}</div>`;
    }
  }

  // --- views -------------------------------------------------------------------------------
  function showYears(current) {
    $("#years").innerHTML = Object.keys(index).map(y => {
      const n = index[y].reduce((s, u) => s + u.canonical, 0);
      return `<a href="#y=${y}" class="${y === current ? "on" : ""}">${y}<small>${n.toLocaleString()}</small></a>`;
    }).join("");
    const on = $("#years a.on"); if (on) on.scrollIntoView({ block: "nearest" });
  }
  function issueLabel(u) {
    const v = `Vol. ${u.volume}`;
    return u.issue.includes("/") ? `${v} · ${u.issue}` : `${v} · ${u.issue}`;
  }
  function groupIssues(units) {
    const g = new Map();
    for (const u of units) { const k = `${u.volume}|${u.issue}`; if (!g.has(k)) g.set(k, []); g.get(k).push(u); }
    return [...g.values()].map(us => { us.sort((a, b) => b.canonical - a.canonical); return us; });
  }
  function showYear(y) {
    showYears(y);
    const units = index[y] || [];
    const groups = groupIssues(units);
    const nIssues = groups.filter(g => !g[0].issue.includes("/")).length;
    $("#content").innerHTML = `<h2>${y}</h2>
      <div class="toolbar"><span>${nIssues} issue${nIssues === 1 ? "" : "s"} · ${units.reduce((s, u) => s + u.canonical, 0).toLocaleString()} canonical articles · ${units.reduce((s, u) => s + u.words, 0).toLocaleString()} words</span></div>
      <div class="issues">${groups.map(g => { const u = g[0]; const others = g.slice(1); const vol = u.issue.includes("/");
        return `
        <div class="issue${vol ? " vol" : ""}" data-unit="${esc(u.unit)}"><b>${issueLabel(u)}</b>${vol ? ` <span class="chip">pages not assigned to an issue</span>` : ""}
          <small>${u.canonical.toLocaleString()} articles · ${u.words.toLocaleString()} words · ${u.pages} pages</small>
          <small class="dim">${esc(u.doc)}</small>
          ${others.map(o => `<small class="dim">also scanned in <a href="#y=${y}&u=${encodeURIComponent(o.unit)}" onclick="event.stopPropagation()">${esc(o.doc)}</a> (${o.articles} records, duplicate copy)</small>`).join("")}
        </div>`; }).join("")}</div>`;
    document.querySelectorAll(".issue").forEach(d => d.addEventListener("click", () => { location.hash = `y=${y}&u=${encodeURIComponent(d.dataset.unit)}`; }));
  }
  async function showIssue(y, unit) {
    showYears(y);
    const u = (index[y] || []).find(x => x.unit === unit);
    if (!u) { $("#content").innerHTML = `<div class="empty">No such issue.</div>`; return; }
    const recs = (await loadYear(y)).filter(r => `${r.volume}|${r.issue}|${r.doc}` === unit);
    const isDup = recs.length && !recs.some(r => r.canonical);
    const canon = isDup ? (index[y] || []).find(x => x.volume === u.volume && x.issue === u.issue && x.canonical > 0) : null;
    const c = $("#content");
    c.innerHTML = `<h2><a href="#y=${y}" style="color:var(--accent);text-decoration:none">${y}</a> › ${issueLabel(u)}</h2>
      <div class="toolbar">
        <span>${(isDup ? recs.length : recs.filter(r => r.canonical).length)} articles · ${(isDup ? recs.reduce((s, r) => s + r.words, 0) : u.words).toLocaleString()} words · ${u.pages} pages · <a href="https://archive.org/details/${esc(u.ia_id)}" target="_blank" style="color:var(--accent)">${esc(u.ia_id)}</a></span>
        ${isDup ? `<span class="chip dup">duplicate copy</span><span>this scan of the issue is not the one used for counting${canon ? `; the canonical copy is <a href="#y=${y}&u=${encodeURIComponent(canon.unit)}" style="color:var(--accent)">${esc(canon.doc)}</a>` : ""}</span>` : ""}
        <button id="expand">Expand all</button><button id="collapse">Collapse all</button>
        ${!isDup && recs.some(r => !r.canonical) ? `<label><input type="checkbox" id="showdup"> show duplicate-copy records (${recs.filter(r => !r.canonical).length})</label>` : ""}
      </div><div id="list"></div>`;
    const list = $("#list"); const els = [];
    recs.forEach((r, i) => { const el = articleEl(r, i + 1); if (!r.canonical && !isDup) el.hidden = true; els.push([el, r]); list.appendChild(el); });
    $("#expand").onclick = () => els.forEach(([el, r]) => !el.hidden && toggle(el, r, true));
    $("#collapse").onclick = () => els.forEach(([el]) => el.classList.remove("open"));
    const cb = $("#showdup"); if (cb) cb.onchange = () => els.forEach(([el, r]) => { if (!r.canonical) el.hidden = !cb.checked; });
  }
  async function showRandom(n = 12) {
    showYears(null);
    const c = $("#content");
    c.innerHTML = `<h2>Random sample</h2><div class="toolbar"><span>${n} canonical articles drawn across the whole corpus, weighted by article count. Reload the page or press the button again for a new draw.</span></div><div id="list" class="sample"></div>`;
    const weights = Object.entries(index).map(([y, us]) => [y, us.reduce((s, u) => s + u.canonical, 0)]);
    const total = weights.reduce((s, [, w]) => s + w, 0);
    const picks = [];
    for (let i = 0; i < n; i++) {
      let r = Math.random() * total, y = weights[weights.length - 1][0];
      for (const [yy, w] of weights) { if ((r -= w) <= 0) { y = yy; break; } }
      const recs = (await loadYear(y)).filter(x => x.canonical);
      picks.push(recs[Math.floor(Math.random() * recs.length)]);
    }
    const list = $("#list");
    picks.forEach((r, i) => {
      const unit = `${r.volume}|${r.issue}|${r.doc}`;
      const el = articleEl(r, i + 1, `<div class="where"><a href="#y=${r.issue.slice(0, 4)}&u=${encodeURIComponent(unit)}" style="color:var(--accent)">${r.issue} · Vol. ${r.volume}</a> · ${esc(r.doc)}</div>`);
      list.appendChild(el); toggle(el, r, true);
    });
  }

  // --- routing -----------------------------------------------------------------------------
  async function route() {
    const q = new URLSearchParams(location.hash.slice(1));
    try {
      if (q.get("r") === "random") await showRandom();
      else if (q.get("y") && q.get("u")) await showIssue(q.get("y"), q.get("u"));
      else if (q.get("y")) showYear(q.get("y"));
      else showYear(Object.keys(index)[0]);
    } catch (e) { $("#content").innerHTML = `<div class="empty">${esc(e.message)}</div>`; status(""); }
    window.scrollTo(0, 0);
  }
  $("#btn-random").onclick = () => { if (location.hash === "#r=random") route(); else location.hash = "r=random"; };
  window.addEventListener("hashchange", route);
  try {
    index = await (await fetch(`${DATA}index.json`)).json();
  } catch (e) {
    $("#content").innerHTML = `<div class="empty">Could not load ${DATA}index.json — serve this directory over HTTP (e.g. <code>python3 -m http.server</code> from the repository root, then open <code>/viewer/</code>).</div>`;
    return;
  }
  route();
})();
</script>
</body>
</html>
